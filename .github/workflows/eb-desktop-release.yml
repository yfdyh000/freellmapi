name: Electrobun desktop release

# Builds the Electrobun (Bun runtime) desktop installer (Windows) and, on a
# `v*-eb` tag, attaches it to the GitHub Release. The Electron build keeps its
# own workflow (desktop-release.yml); this one covers the Electrobun shell
# under desktop/eb/.
#
# Triggers:
#   - push (any branch)  build + upload artifacts so every change is checked
#   - push tags 'v*-eb'  additionally attach the installer to the release
#   - pull_request (desktop)  build-only smoke test so the build can't rot
#
# The data directory is chosen at RUNTIME by the app itself (eb/src/bun/
# config.ts): $FREEAPI_DATA_DIR env → <app-root>/FreeLLMAPI.ini (dataDir key)
# → default Roaming/FreeLLMAPI_Bun. So one artifact serves isolated and
# shared-data installs; no per-variant builds are needed.
#
# Notes:
#   - No VS/toolchain needed: the DB driver is bun:sqlite (built into the
#     runtime), better-sqlite3 native compilation is bypassed, and the CLI
#     downloads its own prebuilt binaries (needs outbound access to
#     github.com; ~117MB CLI + Bun runtime on first run).
#   - `--env=production` is an INVALID value that silently falls back to dev;
#     use `--env=stable` (cli/index.ts:2080-2083).

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*-eb'
  pull_request:
    paths:
      - 'desktop/**'
      - 'client/src/**'
      - '.github/workflows/eb-desktop-release.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build (Electrobun, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node >= 22 so prebuild-install finds a better-sqlite3 binary (v12.x no
      # longer ships node-v115/Node 20 assets); on Node 20 it falls back to a
      # source build, which fails because the pinned @electron/node-gyp does
      # not recognize the VS2026 on windows-latest.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install workspace dependencies
        run: npm install

      # desktop is not a workspace package; electrobun (the build CLI) lives in
      # its devDependencies, so install it too. ci (not install) so the npm
      # scripts in that package.json line up with package-lock.json.
      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Build client
        run: npm run build -w client

      # Default (pwsh) shell rather than bash: Git Bash puts its own MSYS tar
      # first on PATH, which reads the D:\ drive prefix as a remote host and
      # fails with "Cannot connect to D: resolve failed" when hutch extracts
      # its downloads.
      - name: Build Electrobun app
        run: |
          cd desktop
          # client/dist is picked up automatically by the config's
          # clientDistCopy() (electrobun.config.ts).
          npx --no-install electrobun build --env=stable

      # Portable directory: expand the app tarball. bin/launcher.exe alone is
      # the Setup extractor (pops the install wizard), so the portable artifact
      # must carry the fully expanded tree instead. Upload the directory so
      # GitHub's single zip layer gives the user a ready-to-run folder.
      - name: Prepare portable directory
        shell: pwsh
        run: |
          cd desktop/build-eb/stable-win-x64
          $stage = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $tarball = (Get-ChildItem "FreeLLMAPI/Resources/*.tar.zst").FullName
          tar -xf $tarball -C $stage

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLMAPI-portable-win-x64
          path: ${{ runner.temp }}/portable/FreeLLMAPI
          if-no-files-found: error

      - name: Upload installer zip
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLMAPI-Setup-win-x64
          path: desktop/artifact-eb/win-x64-FreeLLMAPI-Setup.zip
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/artifact-eb/*.tar.zst
            desktop/artifact-eb/*.zip
            desktop/artifact-eb/*update.json
            desktop/build-eb/stable-win-x64/*.exe