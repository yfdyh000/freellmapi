name: Electrobun desktop release

# Builds the Electrobun (Bun runtime) desktop installer (Windows) and, on a
# `v*-eb` tag, attaches it to the GitHub Release. The Electron build keeps its
# own workflow (desktop-release.yml); this one covers the Electrobun shell
# under desktop/eb/.
#
# Triggers:
#   - push (any branch)  build + upload artifacts so every change is checked
#   - push tags 'v*-eb'  additionally attach the installer to the release
#   - pull_request (desktop)  build-only smoke test so the build can't rot
#
# The data directory is chosen at RUNTIME by the app itself (eb/src/bun/
# config.ts): $FREEAPI_DATA_DIR env → <app-root>/FreeLLMAPI.ini (dataDir key)
# → default Roaming/FreeLLMAPI_Bun. So one artifact serves isolated and
# shared-data installs; no per-variant builds are needed.
#
# Notes:
#   - No VS/toolchain needed: the DB driver is bun:sqlite (built into the
#     runtime), better-sqlite3 native compilation is bypassed, and the CLI
#     downloads its own prebuilt binaries (needs outbound access to
#     github.com; ~117MB CLI + Bun runtime on first run).
#   - `--env=production` is an INVALID value that silently falls back to dev;
#     use `--env=stable` (cli/index.ts:2080-2083).

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*-eb'
  pull_request:
    paths:
      - 'desktop/**'
      - 'client/src/**'
      - '.github/workflows/eb-desktop-release.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build (Electrobun, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install workspace dependencies
        run: npm install

      # desktop is not a workspace package; electrobun (the build CLI) lives in
      # its devDependencies, so install it too. ci (not install) so the npm
      # scripts in that package.json line up with package-lock.json.
      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Build client
        run: npm run build -w client

      - name: Build Electrobun app
        shell: bash
        run: |
          cd desktop
          # client/dist is picked up automatically by the config's
          # clientDistCopy() (electrobun.config.ts).
          npx --no-install electrobun build --env=stable

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: electrobun-windows-installer
          path: |
            desktop/artifact-eb/*
            desktop/build-eb/stable-win-x64/*.exe
            desktop/build-eb/stable-win-x64/*.metadata.json
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/artifact-eb/*.tar.zst
            desktop/artifact-eb/*.zip
            desktop/artifact-eb/*update.json
            desktop/build-eb/stable-win-x64/*.exe