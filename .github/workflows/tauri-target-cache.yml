# Pre-builds the Tauri shell's debug target on a fast CI runner and ships the
# compiled target/ as an artifact. The local machine (old 4-core CPU + HDD)
# downloads this cache instead of doing the 30-60 min full compile itself, so
# local builds stay incremental (~2 min). Runs on the private YF-my repo.
name: tauri-target-cache

on:
  workflow_dispatch:
  push:
    branches:
      - my/tauri
    paths:
      - 'desktop/src-tauri/**'

jobs:
  build-target:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pin to the exact local toolchain (1.97.1) so fingerprints match and the
      # downloaded cache is usable locally; a newer stable would invalidate it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'

      # tauri-build validates externalBin existence at build time. The real
      # SEA sidecar is produced by desktop/scripts/build-sidecar-sea.mjs and
      # lives only in the local gitignored binaries/ dir; on CI, stub it so
      # the shell's compile-only target cache can be built.
      - name: Stub sidecar binary (existence check only)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force -Path desktop/src-tauri/binaries/freellmapi-sidecar-x86_64-pc-windows-msvc.exe | Out-Null

      - name: Build debug target
        run: cargo build --manifest-path desktop/src-tauri/Cargo.toml

      - name: Package target dir
        shell: pwsh
        run: tar -czf target.tar.gz -C desktop/src-tauri/target .

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-target-win
          path: target.tar.gz
          retention-days: 30
